name: MSME Portal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            MSME_frontend/package-lock.json
            msme-backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: MSME_frontend
        run: npm ci

      - name: Build Angular frontend
        working-directory: MSME_frontend
        run: npx ng build

      - name: Install backend dependencies
        working-directory: msme-backend
        run: npm ci

      - name: Check backend syntax
        working-directory: msme-backend
        run: node --check server.js
        
      - name: Intentional test failure
        run: exit 1
